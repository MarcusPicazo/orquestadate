<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Una Noche, Dos Ciudades — El Concierto</title>
<meta name="description" content="Mapache Mapachoso dirige una sinfonia privada para Jazz y Marcus.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎼</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="theater">
  <div class="proscenium" aria-hidden="true">
    <div class="valance"></div>
    <div class="pillar pillar--left"></div>
    <div class="pillar pillar--right"></div>
  </div>

  <div class="stage-wrap">
    <svg id="stage-svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Escenario con la orquesta de Mapache Mapachoso">
      <defs>
        <radialGradient id="stageGlow" cx="50%" cy="10%" r="95%">
          <stop offset="0%" stop-color="#3a2438"/>
          <stop offset="45%" stop-color="#241530"/>
          <stop offset="100%" stop-color="#0c0814"/>
        </radialGradient>
        <linearGradient id="riserShade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#4a3326"/>
          <stop offset="100%" stop-color="#2a1b14"/>
        </linearGradient>
        <linearGradient id="columnShade" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#1c1320"/>
          <stop offset="50%" stop-color="#3a2a38"/>
          <stop offset="100%" stop-color="#1c1320"/>
        </linearGradient>
        <radialGradient id="archGlow" cx="50%" cy="20%" r="75%">
          <stop offset="0%" stop-color="#8a5a3a" stop-opacity=".55"/>
          <stop offset="100%" stop-color="#8a5a3a" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="chandelierGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#f3d79a" stop-opacity=".9"/>
          <stop offset="100%" stop-color="#f3d79a" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="carpetShade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#5a1620"/>
          <stop offset="100%" stop-color="#3a0e14"/>
        </linearGradient>
      </defs>

      <!-- fondo -->
      <rect x="0" y="0" width="1600" height="1000" fill="url(#stageGlow)"/>

      <!-- arco / escalinata sugerida al fondo -->
      <path d="M 560,360 Q 560,120 800,100 Q 1040,120 1040,360 Z" fill="url(#archGlow)"/>
      <g aria-hidden="true" opacity=".5">
        <path d="M 600,360 L 640,200 Q 800,165 960,200 L 1000,360 Z" fill="none" stroke="#cda45e" stroke-width="2"/>
        <path d="M 650,360 L 680,230 L 920,230 L 950,360" fill="none" stroke="#cda45e" stroke-width="1.4" opacity=".7"/>
      </g>

      <!-- columnas -->
      <g id="columns" aria-hidden="true" opacity=".85">
        <rect x="150" y="150" width="120" height="8" fill="url(#columnShade)"/>
        <rect x="1330" y="150" width="120" height="8" fill="url(#columnShade)"/>
        <g fill="url(#columnShade)">
          <rect x="190" y="130" width="24" height="280"/>
          <rect x="330" y="140" width="22" height="260"/>
          <rect x="1250" y="140" width="22" height="260"/>
          <rect x="1388" y="130" width="24" height="280"/>
        </g>
        <g fill="none" stroke="#cda45e" stroke-width="2.4">
          <rect x="190" y="130" width="24" height="280"/>
          <rect x="330" y="140" width="22" height="260"/>
          <rect x="1250" y="140" width="22" height="260"/>
          <rect x="1388" y="130" width="24" height="280"/>
        </g>
        <path d="M 182,130 L 222,130 L 214,112 L 190,112 Z M 322,140 L 354,140 L 346,124 L 330,124 Z M 1246,140 L 1278,140 L 1272,124 L 1256,124 Z M 1380,130 L 1420,130 L 1412,112 L 1390,112 Z" fill="#cda45e" opacity=".7"/>
      </g>

      <!-- arañas de luces -->
      <g aria-hidden="true">
        <circle cx="420" cy="90" r="70" fill="url(#chandelierGlow)"/>
        <circle cx="1180" cy="90" r="70" fill="url(#chandelierGlow)"/>
        <line x1="420" y1="20" x2="420" y2="60" stroke="#cda45e" stroke-width="2"/>
        <line x1="1180" y1="20" x2="1180" y2="60" stroke="#cda45e" stroke-width="2"/>
        <circle cx="420" cy="66" r="14" fill="#e8c788" stroke="#8a6a32" stroke-width="2"/>
        <circle cx="1180" cy="66" r="14" fill="#e8c788" stroke="#8a6a32" stroke-width="2"/>
        <g stroke="#f3d79a" stroke-width="1.6" opacity=".8">
          <line x1="420" y1="66" x2="395" y2="92"/><line x1="420" y1="66" x2="445" y2="92"/>
          <line x1="420" y1="66" x2="408" y2="96"/><line x1="420" y1="66" x2="432" y2="96"/>
          <line x1="1180" y1="66" x2="1155" y2="92"/><line x1="1180" y1="66" x2="1205" y2="92"/>
          <line x1="1180" y1="66" x2="1168" y2="96"/><line x1="1180" y1="66" x2="1192" y2="96"/>
        </g>
      </g>

      <!-- cortinas rojas laterales dentro del escenario -->
      <g aria-hidden="true">
        <path d="M 0,0 L 130,0 Q 95,500 150,1000 L 0,1000 Z" fill="#5a1620"/>
        <path d="M 1600,0 L 1470,0 Q 1505,500 1450,1000 L 1600,1000 Z" fill="#5a1620"/>
        <path d="M 0,0 L 130,0 Q 95,500 150,1000 L 0,1000 Z" fill="none" stroke="#cda45e" stroke-width="3" opacity=".5"/>
        <path d="M 1600,0 L 1470,0 Q 1505,500 1450,1000 L 1600,1000 Z" fill="none" stroke="#cda45e" stroke-width="3" opacity=".5"/>
      </g>

      <!-- graderio en escalones, de atras hacia adelante -->
      <g id="risers" aria-hidden="true">
        <path d="M 150,420 L 1450,420 L 1450,330 L 150,330 Z" fill="url(#riserShade)" opacity=".5"/>
        <path d="M 150,560 L 1450,560 L 1450,430 L 150,430 Z" fill="url(#riserShade)" opacity=".68"/>
        <path d="M 130,700 L 1470,700 L 1470,570 L 130,570 Z" fill="url(#riserShade)" opacity=".85"/>
        <path d="M 110,900 L 1490,900 L 1490,710 L 110,710 Z" fill="url(#riserShade)"/>
        <path d="M 150,420 L 1450,420 L 1450,410 L 150,410 Z" fill="#cda45e" opacity=".35"/>
        <path d="M 150,560 L 1450,560 L 1450,550 L 150,550 Z" fill="#cda45e" opacity=".35"/>
        <path d="M 130,700 L 1470,700 L 1470,690 L 130,690 Z" fill="#cda45e" opacity=".35"/>
      </g>

      <!-- alfombra roja frontal -->
      <path d="M 40,1000 L 1560,1000 L 1490,900 L 110,900 Z" fill="url(#carpetShade)"/>
      <path d="M 110,900 L 1490,900" stroke="#cda45e" stroke-width="3" opacity=".5"/>

      <!-- podio del director, justo bajo sus pies. Esta hasta el
           frente del escenario (el director dirige de cara a la
           orquesta, entre ella y el publico). -->
      <g id="podium" aria-hidden="true" transform="translate(0,79)">
        <ellipse cx="800" cy="862" rx="74" ry="16" fill="#1c0e10" opacity=".5"/>
        <path d="M 753,823 L 847,823 L 860,862 L 740,862 Z" fill="#3a2d1f" stroke="#1c140c" stroke-width="2.4"/>
        <rect x="746" y="813" width="108" height="12" rx="2" fill="#4a3826"/>
        <rect x="746" y="813" width="108" height="3.6" fill="#cda45e"/>
        <!-- atril con la partitura, frente al director -->
        <rect x="797" y="778" width="6" height="38" fill="#2c1f14"/>
        <path d="M 800,758 L 757,774 L 757,801 L 800,789 Z" fill="#f3ece0" stroke="#8a7244" stroke-width="1.6"/>
        <path d="M 800,758 L 843,774 L 843,801 L 800,789 Z" fill="#f3ece0" stroke="#8a7244" stroke-width="1.6"/>
        <path d="M 763,779 L 794,774 M 763,786 L 795,781 M 763,793 L 796,788" stroke="#9c8a66" stroke-width="1.2" opacity=".75"/>
        <path d="M 806,774 L 837,779 M 805,781 L 837,786 M 804,788 L 837,793" stroke="#9c8a66" stroke-width="1.2" opacity=".75"/>
      </g>

      <!-- piano de cola (prop fijo; silueta real de perfil, con
           banca. El zorro se sienta en la banca, a la izquierda del
           director, sin estorbar a las cuerdas. -->
      <g id="piano-prop" aria-hidden="true" transform="translate(508,738) scale(0.72)">
        <ellipse cx="107" cy="222" rx="200" ry="20" fill="#05060a" opacity=".4"/>
        <!-- banca -->
        <rect x="-78" y="138" width="58" height="16" rx="2" fill="#171219" stroke="#05060a" stroke-width="2"/>
        <path d="M -72,154 L -75,200 L -65,200 L -63,156 Z" fill="#171219"/>
        <path d="M -27,154 L -24,200 L -14,200 L -16,156 Z" fill="#171219"/>
        <!-- cuerpo del piano de cola, de perfil, tapa abierta -->
        <path d="M 90,0 L 40,68 Q 32,110 30,150 Q 60,180 130,186 Q 210,188 260,168 Q 292,148 288,118 Q 284,90 255,65 Q 220,35 170,18 Q 130,6 90,0 Z" fill="#0c0d12" stroke="#05060a" stroke-width="4"/>
        <path d="M 40,68 Q 32,110 30,150" fill="none" stroke="#2a2b33" stroke-width="2" opacity=".6"/>
        <path d="M 90,0 L 170,18 Q 220,35 255,65" fill="none" stroke="#2a2b33" stroke-width="2" opacity=".5"/>
        <!-- patas -->
        <path d="M 42,150 L 36,212 L 48,212 L 50,154 Z" fill="#0c0d12"/>
        <path d="M 145,186 L 140,218 L 154,218 L 158,188 Z" fill="#0c0d12"/>
        <path d="M 248,172 L 244,210 L 258,210 L 262,174 Z" fill="#0c0d12"/>
      </g>

      <g id="musicians-layer"></g>
      <g id="conductor-layer"></g>
      <g id="piano-musician"></g>
    </svg>

    <div class="curtain-final curtain-final--left" aria-hidden="true"></div>
    <div class="curtain-final curtain-final--right" aria-hidden="true"></div>

    <div id="start-overlay" class="start-overlay">
      <p class="start-title">Una Noche, Dos Ciudades</p>
      <p class="start-sub">Una sinfonia privada, dirigida por Mapache Mapachoso</p>
      <button id="btn-start" class="btn-gold" type="button">Comenzar el concierto</button>
    </div>
  </div>
</div>

<div class="transport" id="transport">
  <div class="transport-top">
    <span class="movement-index" id="movement-index">I</span>
    <div class="movement-info">
      <span class="movement-title" id="movement-title">Mia &amp; Sebastian's Theme</span>
      <span class="movement-sub" id="movement-sub">La La Land · Mapache Mapachoso, piano solo</span>
    </div>
  </div>
  <div class="transport-controls">
    <button id="btn-prev" class="transport-btn" type="button" aria-label="Movimiento anterior">⏮</button>
    <button id="btn-rew" class="transport-btn" type="button" aria-label="Retroceder 10 segundos">⟲10</button>
    <button id="btn-play" class="transport-btn transport-btn--play" type="button" aria-label="Reproducir">▶</button>
    <button id="btn-fwd" class="transport-btn" type="button" aria-label="Avanzar 10 segundos">10⟳</button>
    <button id="btn-next" class="transport-btn" type="button" aria-label="Siguiente movimiento">⏭</button>
  </div>
  <div class="seek-row">
    <span class="time-label" id="time-current">0:00</span>
    <input type="range" id="seek-bar" class="seek-bar" min="0" max="1000" value="0" step="1">
    <span class="time-label" id="time-duration">0:00</span>
  </div>
</div>

<audio id="audio-player" preload="metadata"></audio>

<script src="js/orchestra-data.js?v=27"></script>
<script src="js/script.js?v=27"></script>
</body>
</html>
